name: Preset & Rule Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "community-presets/**"
      - "schemas/**"
      - "scripts/validate-presets.mjs"
  pull_request:
    branches: [main]
    paths:
      - "community-presets/**"
      - "schemas/**"
      - "scripts/validate-presets.mjs"

jobs:
  validate:
    name: Validate Community Presets & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Presets & Rule Quality (Score >= 80)
        run: node ./scripts/validate-presets.mjs
