name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-tests.yml"

jobs:
  test:
    name: devscratchpad CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run CLI tests (offline, zero dependencies)
        working-directory: cli
        run: npm test
