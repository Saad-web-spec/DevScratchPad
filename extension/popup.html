    body {
      width: 250px;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;

      color: #8b949e;
      margin-bottom: 16px;

      display: block;
      text-align: center;

      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s;

      background-color: #2ea043;
    }
